<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F1EEE7">
  <meta name="description" content="Find a NYC side quest that fits your free time.">
  <title>Explore | NYC Side Quest</title>
  <link rel="stylesheet" href="explore.css"><script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to activities</a>
  <div class="app-shell">
    <header class="site-header">
      <a href="index.html" class="wordmark">NYC SIDE QUEST<span class="rays">✳</span></a>
      <span class="settings-button">⚙</span>
    </header>
    <main id="main-content">
      <section class="page" id="page-explore" data-page="explore">
        <div class="explore-intro"><div><h1 id="explore-title">Where to next?</h1><p>Your next little adventure starts here.

        </p>
        <span class="small-scribble"></span></div></div>
        <section class="filter-panel paper-panel">
          <h2 class="eyebrow" id="free-time-heading">Quick Filter</h2>
          <div class="time-buttons" id="time-buttons">
            <button type="button" class="time-chip" id="all-filter">
              All
            </button>
            <button type="button" class="time-chip" id="solo-filter">
              Solo
            </button>
            <button type="button" class="time-chip" id="free-filter">
              Free
            </button>
            <button type="button" class="time-chip" id="hour-filter">
              1h
            </button>
            <button type="button" class="time-chip" id="budget-filter">
              <$20
            </button>
            <button type="button" class="time-chip" id="more-filter">
              More
            </button>
          </div>

        </section>
        <section class="surprise-banner">
          <div>
            <span class="eyebrow">FEELING LUCKY?</span>
            <h2 id="surprise-heading">Surprise Me!</h2>
            <p>Get a random side quest<br>for your free time.</p>
            <span class="arrow-disc">➜</span></div></section>
        <div class="section-heading">
          <h2>Little adventures to try</h2>
          <span class="activity-count" id="activity-count">6 activities</span>
        </div>
        <!-- ASSIGNMENT 6: cards below are generated in JavaScript, not hardcoded in HTML. -->

        <div class="quest-grid" id="quest-container">
        </div>
      </section>
    </main>
  </div>
  <nav class="bottom-bar"><div class="bottom-nav">
    <a href="calendar.html" data-route="calendar" class="nav-link"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 18h3M14 14h3"/></svg><span>Calendar</span></a>
    <a href="explore.html" data-route="explore" class="nav-link is-active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.8 8.2-2.4 5.2-5.2 2.4 2.4-5.2z"/></svg><span>Explore</span></a>
    <span data-route="collection" class="nav-link" ><svg viewBox="0 0 24 24"><path d="M4 20h16M8 20v-5l-2-3c-1.5-2.6 1.2-4.5 3.5-3 1.2 1 1.5 2.2 2.5 2.2s1.3-1.2 2.5-2.2c2.3-1.5 5 .4 3.5 3l-2 3v5M6 17h12"/></svg><span>Collection</span></span>
    <span data-route="map" class="nav-link"><svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg><span>Map</span></span>
  </div><span class="add-button preview-add">+</span></nav>
</body>
</html>
